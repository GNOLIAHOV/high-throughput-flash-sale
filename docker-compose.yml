services:
  postgres:
    image: postgres:16-alpine
    container_name: flashdeal_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: flashdeal_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flashdeal_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: flashdeal_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: always

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flashdeal_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/flashdeal_db?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3000
    restart: always

volumes:
  postgres_data:
  redis_data: